# Publishes the PDF Studio browser app (apps/studio) to GitHub Pages.
# The app is fully static, so the folder is uploaded as-is — no build step.
name: Deploy PDF Studio to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/studio/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish, but skip queued ones in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio
      - id: deployment
        uses: actions/deploy-pages@v4
